name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact ref to verify for a reusable release check
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RPROXY_TEST_REDIS: redis://127.0.0.1:16379/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Check formatting
        run: cargo fmt --check
      - name: Check lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --locked --all-targets
      - name: Test Python maintenance
        run: python -m unittest discover -s scripts/tests -v
      - name: Test release packaging
        run: python -m unittest discover -s scripts/release_tests -v
