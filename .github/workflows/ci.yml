name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact ref to verify for a reusable release check
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lint
        run: cargo clippy --locked --workspace --all-targets --jobs 1 -- -D warnings
      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets --jobs 1

  docker:
    name: Docker image check
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build the single production image
        run: docker build --tag rproxy-ci .
      - name: Check both packaged programs without network access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges rproxy-ci --version
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint rproxy-cli rproxy-ci --version
      - name: Start one offline container and exercise its management CLI
        shell: bash
        run: |
          configuration="$(mktemp -d)"
          cp rproxy.example.toml "$configuration/rproxy.toml"
          cp providers.env.example "$configuration/providers.env"
          export RPROXY_ADMIN_TOKEN="$(openssl rand -hex 32)"
          export RPROXY_PASSWORD="$(openssl rand -hex 24)"
          container=""
          cleanup() {
            if [[ -n "$container" ]]; then
              docker rm --force --volumes "$container"
            fi
            rm -rf "$configuration"
          }
          trap cleanup EXIT
          container="$(docker run -d --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env RPROXY_ADMIN_TOKEN --env RPROXY_PASSWORD \
            --mount "type=bind,src=$configuration/rproxy.toml,dst=/etc/rproxy/rproxy.toml,readonly" \
            --mount "type=bind,src=$configuration/providers.env,dst=/etc/rproxy/providers.env,readonly" \
            --volume /var/lib/rproxy rproxy-ci)"
          ready=false
          for attempt in {1..30}; do
            if docker exec "$container" rproxy-cli health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs --tail 100 "$container"
            exit 1
          fi
          printf '%s\n' "$RPROXY_PASSWORD" | docker exec -i "$container" rproxy-cli user add docker-smoke --business shop --password-stdin
          docker exec "$container" rproxy-cli user show docker-smoke
