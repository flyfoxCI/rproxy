name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact ref to verify for a reusable release check
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lint
        run: cargo clippy --locked --workspace --all-targets --jobs 1 -- -D warnings
      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets --jobs 1

  compose:
    name: Single-service Compose integration
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Test managed lifecycle with owned fixtures
        run: cargo run --locked -p xtask -- compose-smoke --engine docker
