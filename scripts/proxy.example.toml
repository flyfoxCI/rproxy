# Python 3.11+ collector bootstrap. Copy to scripts/proxy.toml.
# Sources are managed online by rproxy-cli, not by this file.
# See docs/collector-management.md for explicit legacy provider import and mappings.
workers = 4
poll_seconds = 3

[rproxy]
# For native execution use http://127.0.0.1:9100 instead.
# Use an internal network, trusted HTTPS, or an SSH tunnel; do not expose plain HTTP publicly.
url = "http://rproxy:9100"
token_env = "RPROXY_WORKER_TOKEN"
timeout_seconds = 15
# ca_certificate = "certs/rproxy-ca.pem" # Relative to this bootstrap file.
