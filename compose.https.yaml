# Enable https_bind and [tls] in rproxy.toml before using this override.
# docker compose -f compose.yaml -f compose.https.yaml up -d --build
services:
  rproxy:
    ports:
      - "${RPROXY_BIND_ADDRESS:-127.0.0.1}:${RPROXY_HTTPS_PORT:-9443}:9443"
    volumes:
      - type: bind
        source: ${RPROXY_CERTS_DIR:-./certs}
        target: /etc/rproxy/certs
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
