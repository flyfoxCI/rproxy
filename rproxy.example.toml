# Copy to rproxy.toml, replace the password, and restrict file permissions.
# Relative certificate paths are resolved from this configuration's directory.
redis_url = "redis://127.0.0.1:6379/"
redis_key = "proxy:pool"
http_bind = "127.0.0.1:9099"
socks5_bind = "127.0.0.1:9089"
# https_bind = "127.0.0.1:9443"

# [tls]
# certificate = "certs/fullchain.pem"
# private_key = "certs/private-key.pem"

[auth]
ttl_seconds = 3600
# Used for clients without explicit route fields.
default_session = "default"
default_strategy = "random"

[[auth.users]]
name = "alice"
password = "change-me-before-use"
businesses = ["shop", "news"]
version = 1

[routing]
lease_seconds = 30
renew_seconds = 5
connect_timeout_seconds = 10
handshake_timeout_seconds = 15
cooldown_seconds = 30
max_attempts = 3
max_connections = 4096

[probe]
enabled = true
url = "https://api.ipify.org/"
tunnel_url = "https://api.ipify.org/"
interval_seconds = 300
timeout_seconds = 10
max_age_seconds = 900
concurrency = 16
# Applies ONLY to rproxy's own exit-check requests, never client TLS tunnels.
insecure = false
# ca_certificate = "certs/probe-ca.pem"
