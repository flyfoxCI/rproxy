# Copy to rproxy.toml. Secrets come from the process environment, not this file.
# Relative database/certificate paths resolve from this configuration's directory.
database = "data/rproxy.sqlite3"
max_proxies = 1000
http_bind = "127.0.0.1:9099"
socks5_bind = "127.0.0.1:9089"
# https_bind = "0.0.0.0:9443" # Container HTTPS requires compose.https.yaml too.

[admin]
enabled = true
bind = "127.0.0.1:9100"
token_env = "RPROXY_ADMIN_TOKEN" # At least 16 non-space ASCII characters.

# [tls]
# certificate = "certs/fullchain.pem"
# private_key = "certs/private-key.pem"

[auth]
ttl_seconds = 3600
default_session = "default"
default_strategy = "random"

[[auth.users]]
name = "alice"
password_env = "RPROXY_PASSWORD"
businesses = ["shop", "news"]
version = 1
# Alternatively remove password_env and set password = "..."; never use both.

[routing]
connect_timeout_seconds = 10
handshake_timeout_seconds = 15
cooldown_seconds = 30
max_attempts = 3
max_connections = 4096

[probe]
# Disables periodic refresh only; new candidates and verify-pool still trigger checks.
enabled = true
url = "https://api.ipify.org/"
tunnel_url = "https://api.ipify.org/"
interval_seconds = 300
timeout_seconds = 10
max_age_seconds = 900
concurrency = 16
# Applies ONLY to rproxy's own exit-check requests, never client TLS tunnels.
insecure = false
# ca_certificate = "certs/probe-ca.pem"
